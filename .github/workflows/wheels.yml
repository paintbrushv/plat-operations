name: Native wheels
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: auto
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/release_gate.py
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
          sccache: true
      - name: Verify native wheel on Python 3.12
        shell: bash
        run: python scripts/check_native.py dist/*.whl
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify native wheel on Python 3.11
        shell: bash
        run: python scripts/check_native.py dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operations-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (toolchain: stable below)
        with:
          toolchain: stable
      - run: pip install maturin==1.15.0
      - run: maturin sdist --out dist
      - name: Build the source distribution in isolation
        run: pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
      - name: Verify rebuilt native wheel
        run: python scripts/check_native.py rebuilt/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operations-sdist
          path: dist/*.tar.gz
