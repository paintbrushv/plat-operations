name: boxscore-ci

# Gates the Boxscore Rust harness on every push/PR: format, lint (warnings as
# errors), and the full test suite. The crate lives in boxscore/, so all cargo
# steps run from there. See AGENTS.md / docs/BOXSCORE_ENGINEERING.md.

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'boxscore/**'
      - 'QUICKSTART.md'
      - 'docs/quickstart/**'
      - 'scripts/quickstart_check.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'boxscore/**'
      - 'QUICKSTART.md'
      - 'docs/quickstart/**'
      - 'scripts/quickstart_check.sh'
      - '.github/workflows/ci.yml'

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: check · clippy · test · fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boxscore
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: boxscore

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Doc tests
        run: cargo test --doc

  # Connector conformance: the catalog, MCP stdio and HTTP transports must
  # return identical envelopes for the golden corpus. Runs only on pull
  # requests that touch the exact-cent code, the corpus or its driver; the
  # `test` job above already runs it as part of `cargo test --all-targets`.
  conformance:
    name: conformance · catalog connectors
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boxscore
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect connector, catalog or corpus changes
        id: changes
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep -Eq '^boxscore/(src/exact/|tests/fixtures/catalog/|tests/exact_conformance\.rs$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes under boxscore/src/exact/, the corpus or its driver; skipping."
          fi

      - name: Install Rust toolchain
        if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: boxscore

      - name: Conformance suite
        if: steps.changes.outputs.run == 'true'
        run: cargo test --test exact_conformance

  # The quickstart cannot rot: build the release binary and run every
  # native-binary command of QUICKSTART.md against the synthetic files in
  # docs/quickstart/, asserting the numbers the document quotes.
  quickstart:
    name: quickstart · native commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: boxscore

      - name: Build boxscore-exact (release)
        working-directory: boxscore
        run: cargo build --locked --release --bin boxscore-exact

      - name: Run the quickstart
        run: scripts/quickstart_check.sh
