name: boxscore-ci

# Gates the Boxscore Rust harness on every push/PR: format, lint (warnings as
# errors), and the full test suite. The crate lives in boxscore/, so all cargo
# steps run from there. See AGENTS.md / docs/BOXSCORE_ENGINEERING.md.

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'boxscore/**'
      - 'QUICKSTART.md'
      - 'START_HERE.md'
      - 'docs/quickstart/**'
      - 'scripts/quickstart_check.sh'
      - 'scripts/workbench_unit_test.mjs'
      - 'evals/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'boxscore/**'
      - 'QUICKSTART.md'
      - 'START_HERE.md'
      - 'docs/quickstart/**'
      - 'scripts/quickstart_check.sh'
      - 'scripts/workbench_unit_test.mjs'
      - 'evals/**'
      - '.github/workflows/ci.yml'

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: check · clippy · test · fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boxscore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (toolchain: stable below)
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: boxscore

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # The workbench page's pure sign-in decisions (app.js exports them under
      # node only), on the runner's preinstalled Node with its built-in test
      # runner: no npm, no dependencies.
      - name: Workbench sign-in unit tests (node --test)
        working-directory: .
        run: node --test scripts/workbench_unit_test.mjs

      - name: Doc tests
        run: cargo test --doc

      # The agent eval harness's own tests (number extraction, scorer, report,
      # scenario files, runner plumbing) over committed fixtures. Needs pytest
      # only: no network, no API key, no `anthropic` package (run.py imports it
      # lazily), and the few tests that drive the engine skip themselves because
      # no release binary is built here. The live evals never run in CI: see
      # evals/README.md. A venv, because the runner's system Python is
      # externally managed.
      - name: Agent eval tests (pytest)
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/evals-venv"
          . "$RUNNER_TEMP/evals-venv/bin/activate"
          python3 -m pip install --quiet pytest==9.1.1
          python3 -m pytest evals/

  # Connector conformance: the catalog, MCP stdio and HTTP transports must
  # return identical envelopes for the golden corpus. Runs only on pull
  # requests that touch the exact-cent code, the corpus or its driver; the
  # `test` job above already runs it as part of `cargo test --all-targets`.
  conformance:
    name: conformance · catalog connectors
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boxscore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Detect connector, catalog or corpus changes
        id: changes
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep -Eq '^boxscore/(src/exact/|tests/fixtures/catalog/|tests/exact_conformance\.rs$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes under boxscore/src/exact/, the corpus or its driver; skipping."
          fi

      - name: Install Rust toolchain
        if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (toolchain: stable below)
        with:
          toolchain: stable

      - name: Cache cargo build
        if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: boxscore

      - name: Conformance suite
        if: steps.changes.outputs.run == 'true'
        run: cargo test --test exact_conformance

  # The quickstart cannot rot: build the release binary and run every
  # native-binary command of QUICKSTART.md against the synthetic files in
  # docs/quickstart/, asserting the numbers the document quotes.
  quickstart:
    name: quickstart · native commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (toolchain: stable below)
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: boxscore

      - name: Build boxscore-exact (release)
        working-directory: boxscore
        run: cargo build --locked --release --bin boxscore-exact

      - name: Run the quickstart
        run: scripts/quickstart_check.sh
