name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_gate.py --tag "$RELEASE_TAG" --check-registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
  verify:
    needs: gate
    uses: ./.github/workflows/wheels.yml
  rust-tests:
    needs: gate
    uses: ./.github/workflows/ci.yml
  # Container image: built, checked, pushed to GHCR and signed after the gate.
  # It runs alongside the PyPI path and does not block `publish`. Registry
  # write and OIDC token permissions are granted to this job only. Actions are
  # pinned by major tag; pin them to commit SHAs when cutting a release.
  image:
    needs: gate
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      push: true
  publish:
    needs: [verify, rust-tests]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: operations-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
