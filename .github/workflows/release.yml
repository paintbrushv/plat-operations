name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/release_gate.py --tag "$RELEASE_TAG" --check-registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
  verify:
    needs: gate
    uses: ./.github/workflows/wheels.yml
  rust-tests:
    needs: gate
    uses: ./.github/workflows/ci.yml
  # Container image: built, checked, pushed to GHCR and signed after the gate.
  # It runs alongside the PyPI path and does not block `publish`. Registry
  # write and OIDC token permissions are granted to this job only. Actions are
  # pinned to full commit SHAs (the tag is in the trailing comment); re-pin
  # them, resolving the new tag to its commit, whenever one is upgraded.
  image:
    needs: gate
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      push: true
  publish:
    needs: [verify, rust-tests]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: operations-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
